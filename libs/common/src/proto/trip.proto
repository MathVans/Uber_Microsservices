syntax = "proto3";

package trips;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/any.proto";

service Trips {
  rpc health (google.protobuf.Empty) returns (google.protobuf.Any){};
  rpc estimate (EstimateRequest) returns (EstimateResponse){};
  rpc create (CreateTripRequest) returns (TripResponse){};
}

message EstimateRequest {
  string origin = 1;
  string destination = 2;
}

message EstimateResponse {
  int32 estimatedPrice = 1;
  string currency = 2;
  string distance = 3;
  string duration = 4;
  string start_address = 5;
  string end_address = 6;
}

message CreateTripRequest {
  string passengerId = 1;
  string origin = 2;
  string destination = 3;
  int32 durationInSeconds = 4;
  int32 distanceInMeters = 5;
}

message TripResponse {
  string id = 1;
  string passengerId = 2;
  optional string driverId = 3;
  string status = 4;
  optional float finalPrice = 5;
  google.protobuf.Timestamp createdAt = 6;
}