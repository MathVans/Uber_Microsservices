syntax = "proto3"; 

package identity; 

service IdentityService {
  rpc FindOne (FindOneRequest) returns (UserResponse){};
  rpc Update (UpdateRequest) returns (UserResponse){};
}

message FindOneRequest {
  string id = 1; 
}


message UpdateRequest {
  string id = 1;
  string name = 2;
  string role = 3; 
}

message UserResponse {
  string id = 1;
  string name = 2;
  string email= 3;
  string role = 4;
}