syntax = "proto3"; 

package authentication; 

service Authentication {
  rpc Register (RegisterRequest) returns (JwtTokenResponse){}
  rpc Login (LoginRequest) returns (JwtTokenResponse){}
}

message LoginRequest {
  string email = 1;
  string password = 2; 
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string role = 4; 
}


message JwtTokenResponse {
  string accessToken = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string id = 5; 
}